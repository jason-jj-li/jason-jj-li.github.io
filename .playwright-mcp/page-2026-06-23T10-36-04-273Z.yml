        - heading "研究领域与方向" [level=2] [ref=e36]
      - paragraph [ref=e37]: 人口健康、社会流行病学与老龄健康研究，聚焦生命历程视角下早期不良经历对中老年健康的长期影响。围绕这一主线，形成三个相互关联的研究方向：第一，探讨童年早期不良经历对心血管代谢性疾病、衰弱、功能受限和心理健康等中老年多维健康结局的长期影响；第二，基于 CHARLS、HRS、ELSA、SHARE、NCDS 和 BCS70 等队列数据，开展中老年健康轨迹分析与跨国比较；第三，开发调查研究与多源异构数据分析相关的方法工具与研究平台。相关成果发表于 Journal of Global Health、The Journal of Nutrition, Health & Aging 等期刊。
