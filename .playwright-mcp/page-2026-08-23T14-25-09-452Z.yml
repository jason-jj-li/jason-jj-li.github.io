              - heading "DEMOG 5 Fundamentals of Population Science" [level=4] [ref=f3e141]:
                - generic [ref=f3e142]: DEMOG 5
                - text: Fundamentals of Population Science
              - paragraph [ref=f3e143]: "This course provides an accessible introduction to the social science of demography. The course is organized around cases in which population issues raise policy or ethical dilemmas (example: China’s one child policy). Through these cases, students will learn how demographers use models and data to acquire knowledge about population. Throughout the course, students will also learn to read, interpret, evaluate, and produce tabular and graphical representations of population data."
