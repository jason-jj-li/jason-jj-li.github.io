            - generic [ref=e231]: "In [2]:"
            - generic [ref=e235]: "import numpy as np import matplotlib.pyplot as plt plt.style.use('seaborn-v0_8-whitegrid') # Step 1: Set parameters we know are true TRUE_MEAN = 170 # e.g. height in cm TRUE_STD = 8 N = 300 # Step 2: Simulate data rng = np.random.default_rng(42) data = rng.normal(loc=TRUE_MEAN, scale=TRUE_STD, size=N) # Step 3: Estimate from data est_mean = data.mean() est_std = data.std(ddof=1) # Step 4: Verify print('=== Hello Simulation ===') print(f'True mean : {TRUE_MEAN} | Estimated: {est_mean:.2f} | Error: {abs(est_mean-TRUE_MEAN):.2f}') print(f'True std : {TRUE_STD} | Estimated: {est_std:.2f} | Error: {abs(est_std-TRUE_STD):.2f}') print() print('If you see numbers above — Python is working correctly.')"
