          - generic [ref=f1e101]:
            - heading "About the Awards" [level=2] [ref=f1e102]
            - paragraph [ref=f1e103]: Congratulations to this year’s award winning academic websites!
          - paragraph [ref=f1e104]: Hi there, I’m Jennifer van Alstyne. This is our 3rd Best Personal Academic Websites Contest. This page celebrates the 2025 award winners. We hope their websites help inspire people around the world to create space for themselves online. Please share these award winning websites with a friend you think should have a website too.
          - paragraph [ref=f1e105]: There are 12 award winners in this year’s contest. In a year we’ve had more entries than ever before, these academic website stood out. Each of the award winners in this year’s contest received a perfect score from the judges.
          - paragraph [ref=f1e106]: While their websites may grow and change with them over time, these award winning academic websites deserve to be celebrated for the work they’re already doing to share their story. Thank you.
          - paragraph [ref=f1e107]:
            - strong [ref=f1e108]: Best wishes,Your Contest Co-Hosts
