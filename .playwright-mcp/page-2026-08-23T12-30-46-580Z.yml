        - generic [ref=f1e92]:
          - paragraph [ref=f1e93]: Congratulations to the winners of the 2025 Best Personal Academic Websites Contest hosted by Jennifer van Alstyne, Brittany Trinh, and Ian Li. This contest celebrates great examples of academic websites from people in Higher Education.
          - paragraph [ref=f1e94]:
