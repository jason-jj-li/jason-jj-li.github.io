          - figure [ref=f1e263]:
            - img "2025 award winners of the personal academic websites contest hosted by Jennifer van Alstyne of The Social Academic. On this graphic are 12 award winning websites from this year's entries." [ref=f1e264]
          - generic [ref=f1e265]:
            - heading "Overall Best Personal Academic Website Award" [level=2] [ref=f1e266]
            - paragraph [ref=f1e267]:
              - strong [ref=f1e268]: Madeline Eppley and Dr. Roberta Rosa Valtorta
              - text: (tied)
            - generic [ref=f1e269]:
              - figure [ref=f1e270]:
                - img "Madeline Eppley Website on Desktop (homepage), Tablet (Research page), and Mobile (Outreach page) screens" [ref=f1e271]
                - link "https://www.madeline-eppley.com/" [ref=f1e273] [cursor=pointer]:
                  - /url: https://www.madeline-eppley.com/cv--about.html
              - heading "Madeline Eppley" [level=3] [ref=f1e274]
              - paragraph [ref=f1e275]: “I made my website because I feel there is a substantial gap in science communication training for graduate students and the broader field of biology. I graduated undergrad in 2020 when a lot of networking and resources went virtual. During this really pivotal stage in my career development, I needed to develop better digital presence and science communication skills to keep pace with the rising importance of networking in virtual academic spaces (e.g. virtual conferences and social media). Through this process, I ended up finding my current PhD position on social media, and also built a digital network that made me feel more connected to the science community online.”
              - paragraph [ref=f1e276]:
                - strong [ref=f1e277]: —Madeline Eppley
              - link "View the website" [ref=f1e280] [cursor=pointer]:
                - /url: https://www.madeline-eppley.com
              - generic [ref=f1e281]:
                - heading "Notes from the judges" [level=4] [ref=f1e282]
                - paragraph [ref=f1e283]:
                  - strong [ref=f1e284]: "Jennifer van Alstyne:"
                  - text: A visually engaging story-rich website. I hope Madeline’s website inspires people to take more photos because it makes such a difference. For instance, there’s a lot of content on this website, but it doesn’t feel overwhelming. While the top menu is initially hard to read, when I start scrolling there’s contrast. I like how Madeline’s research page shares ongoing research and completed research.
                - paragraph [ref=f1e285]:
                  - strong [ref=f1e286]: "Brittany Trinh:"
                  - text: I love Eppley’s website, from the bio to all the photos of the field research. On the homepage, Eppley makes her passion for research and science communication clear, as well as her future goals. The research page explains the importance and impact for each research project and specifies which projects are ongoing or completed. Looking at her website, I am now inspired to go update my own website and incorporate more science in it!
                - paragraph [ref=f1e287]:
                  - strong [ref=f1e288]: "Ian Li:"
                  - text: Eppley’s website is well-organized and provides a lot of details on what inspires her work and the results of her research. She also describes her outreach to college and high school students. Her blog has lots of stories about her research and experience on the field.
            - generic [ref=f1e290]:
              - figure [ref=f1e291]:
                - img "Dr. Roberta Rosa Valtorta Website on Desktop (homepage), Tablet (Publications page), and Mobile (Projects page) screens" [ref=f1e292]
                - link "https://robertavaltorta.research.st/" [ref=f1e294] [cursor=pointer]:
                  - /url: https://robertavaltorta.research.st/
              - heading "Dr. Roberta Rosa Valtorta" [level=3] [ref=f1e295]
              - paragraph [ref=f1e296]: "“I created my personal academic website for several reasons. First, to have one central place where all my work, publications, and projects are collected, making it easier for potential collaborators and anyone interested in my research to find accurate, up-to-date information. Second, to maintain control over my online presence, so that people searching for me don’t just find scattered pieces of information in different places. And finally, for a more personal reason: research can sometimes test self-esteem due to its competitiveness and constant pressure. Having a space where everything I have done is brought together helps me remember who I am, my roots, and the progress I have made.”"
              - paragraph [ref=f1e297]:
                - strong [ref=f1e298]: —Dr. Roberta Rosa Valtorta
              - link "View the website" [ref=f1e301] [cursor=pointer]:
                - /url: https://robertavaltorta.research.st/
              - generic [ref=f1e302]:
                - heading "Notes from the judges" [level=4] [ref=f1e303]
                - paragraph [ref=f1e304]:
                  - strong [ref=f1e305]: "Jennifer van Alstyne:"
                  - text: A thoughtful use of space on an Owlstown website. Dr. Valtorta has an expansive portfolio of publications, projects, and teaching. This website also shares teaching values, such as ways courses contribute to the United Nations Sustainable Development Goals (SDGs). From downloadable syllabi to accessible data, this is a great academic website example.
                - paragraph [ref=f1e306]:
                  - strong [ref=f1e307]: "Brittany Trinh:"
                  - text: Valtorta’s website is great example of what you can do with an Owlstown website! The project pages include an overview, related awards, and related publications, which makes it easier to understand the impact of the research. The teaching pages provide a summary about the classes taught so we can understand the topics covered and importance of the course.
                - paragraph [ref=f1e308]:
                  - strong [ref=f1e309]: "Ian Li:"
                  - text: This is such a great example of an academic website. It is well-organized. Projects are described with related publications, Publications and courses are summarized well. Her intro describes her passion for her research and points to the development of her work. She also shares a blog that is regularly updated. She also provides information in both English and Italian, which widens the reach of her work.
              - paragraph [ref=f1e310]:
                - link "Back to the list of award winners" [ref=f1e311] [cursor=pointer]:
                  - /url: "#list"
          - generic [ref=f1e312]:
            - heading "Owlstown Website Award" [level=2] [ref=f1e313]
            - paragraph [ref=f1e314]:
              - strong [ref=f1e315]: Dr. Akshata Naik
            - generic [ref=f1e316]:
              - figure [ref=f1e317]:
                - img "Akshata Naik Website on Desktop (homepage), tablet (publications page) and mobile (speaking page) screens" [ref=f1e318]
                - link [ref=f1e320] [cursor=pointer]:
                  - /url: https://www.anaikowl.com/
                  - mark [ref=f1e321]: https://www.anaikowl.com/
              - heading "Dr. Akshata Naik" [level=3] [ref=f1e322]
              - paragraph [ref=f1e323]: “I thrive on creativity! Science communication, teaching and new research ideas keep me going. So I wanted to create an online space to portray my work for networking with folks similar to my interests, and importantly serving the broader community via outreach. And being an academician is a good enough reason for building a digital presence as it strategically aligns with my tenure and promotion goals by amplifying the impact of my work beyond traditional boundaries.”
              - paragraph [ref=f1e324]:
                - strong [ref=f1e325]: —Dr. Akshata Naik
              - link "View the website" [ref=f1e328] [cursor=pointer]:
                - /url: https://www.anaikowl.com/
              - generic [ref=f1e329]:
                - heading "Notes from the judges" [level=4] [ref=f1e330]
                - paragraph [ref=f1e331]:
                  - strong [ref=f1e332]: "Jennifer van Alstyne:"
                  - text: I get such a sense of personality from an Owlstown website. This is great. Publications with abstracts make a difference. The buttons, like ‘Get to know me’ stand out as a lovely way to be approachable. The ‘Generated using Canva AI’ disclosure on an image on the blog feels thoughtful (and like the kind of information people appreciate even if they don’t use AI art themselves). The use of emojis in the middle of sentences isn’t ideal for accessibility, and is something I’d recommend revising.
                - paragraph [ref=f1e333]:
                  - strong [ref=f1e334]: "Brittany Trinh:"
                  - text: Naik does a great job on her Owlstown website sharing what she does and why she does it. My favorite page is her Speaking page because it highlights the different talks she has and shares more of her story.
                - paragraph [ref=f1e335]:
                  - strong [ref=f1e336]: "Ian Li:"
                  - text: Naik’s website is a great example of an Owlstown website. It’s very organized with information about herself, her publications, and her speaking engagements. She also shares a blog.
