        - generic [ref=f6e74]: Life-course perspectives on health
      - paragraph [ref=f6e76]: 我的研究主要关注健康的社会生产及其生命历程过程。具体考察早期社会环境、成年工作—家庭—生育经历如何在不同生命阶段累积、传递或得到补偿，并进一步形成中老年健康及健康不平等。研究主要依托中国及国际大型纵向调查和出生队列，运用生命史分析、纵向分析和跨国比较等方法。
