    - heading "About me" [level=2] [ref=f4e37]
    - paragraph [ref=f4e38]:
      - text: "[If you need a formal bio for me, please see my"
      - link "bio generator" [ref=f4e39] [cursor=pointer]:
        - /url: ./bio/
      - text: .]
    - paragraph [ref=f4e40]:
      - text: I'm a computer scientist that became passionate about precision medicine in a quest to diagnose
      - link "my son Bertrand" [ref=f4e41] [cursor=pointer]:
        - /url: http://bertrand.might.net/
      - text: .
    - paragraph [ref=f4e42]: Finding he was the first case of a novel genetic disorder, I pivoted to finding treatments.
    - paragraph [ref=f4e43]: I've ended up applying and generalizing much of what I learned from him to help others, and helping patients facing complex medical challenges has become my life's mission.
    - paragraph [ref=f4e44]: I've spent most of my career in academia, but I have had major parallel stints in government (The White House, 2016-2018) and industry (co-founder at Pairnomix, LLC and [by acquisition] Q State Biosciences, Inc).
    - paragraph [ref=f4e45]: Most of my personal research brings together data science, artificial intelligence, machine learning and formal reasoning to accelerate biomedical science in the service of patients.
    - paragraph [ref=f4e46]: As Director of the Precision Medicine Institute, I oversee a faculty and research staff with a comprehensive research portfolio that includes significant bench science targeted at tailoring therapeutics to individual patients.
    - paragraph [ref=f4e47]: My broader interests include oligonucleotide therapeutics, model organisms, drug screening and medicinal chemistry.
