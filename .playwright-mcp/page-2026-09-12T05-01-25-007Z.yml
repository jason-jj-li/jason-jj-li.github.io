        - heading "Research Profile" [level=2] [ref=f8e202]
        - generic [ref=f8e72]: 生命历程视角下的健康研究
      - paragraph [ref=f8e74]: My research examines the social production of health across the life course. I study how early-life social conditions and adult work, family, and reproductive experiences accumulate, transmit, or offset social disadvantage, and how these processes shape later-life health and health inequalities. My work draws primarily on longitudinal surveys and birth cohorts from China and other countries, using life-history analysis, longitudinal methods, and cross-national comparisons.
