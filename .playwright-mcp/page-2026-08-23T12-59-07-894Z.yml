            - generic [ref=f8e2197]: "# Demonstrate CLT: sample means from highly non-normal populations fig, axes = plt.subplots(2, 4, figsize=(18, 7)) fig.suptitle('Central Limit Theorem Preview: Sample Means Always Become Normal', fontsize=12, fontweight='bold') populations = [ ('Uniform(0,1)', lambda n: RNG.uniform(0, 1, n)), ('Exponential(1)', lambda n: RNG.exponential(1, n)), ('Bernoulli(p=0.2)', lambda n: RNG.binomial(1, 0.2, n).astype(float)), ('Bimodal', lambda n: np.where(RNG.uniform(0,1,n)<0.5, RNG.normal(-2,0.5,n), RNG.normal(2,0.5,n))), ] N_REPS = 3000 N_SAMPLE = 50 for col, (name, gen) in enumerate(populations): # Row 0: population distribution pop = gen(5000) axes[0, col].hist(pop, bins=50, density=True, color=COLORS['secondary'], edgecolor='white', alpha=0.75) axes[0, col].set_title(f'Population: {name}') axes[0, col].set_xlabel('Value') axes[0, col].set_ylabel('Density') skew_v = stats.skew(pop) axes[0, col].text(0.97, 0.97, f'skew={skew_v:.2f}', transform=axes[0, col].transAxes, ha='right', va='top', fontsize=8, bbox=dict(boxstyle='round', fc='white', alpha=0.7)) # Row 1: sampling distribution of the mean (n=50) sample_means = [gen(N_SAMPLE).mean() for _ in range(N_REPS)] sm = np.array(sample_means) axes[1, col].hist(sm, bins=50, density=True, color=COLORS['primary'], edgecolor='white', alpha=0.75) # Overlay expected normal distribution expected_mu = pop.mean() expected_sigma = pop.std(ddof=1) / np.sqrt(N_SAMPLE) x_range = np.linspace(sm.min(), sm.max(), 200) axes[1, col].plot(x_range, stats.norm.pdf(x_range, expected_mu, expected_sigma), color=COLORS['danger'], lw=2.5, label=f'N({expected_mu:.2f}, {expected_sigma:.3f})') axes[1, col].set_title(f'Sample means (n={N_SAMPLE}, reps={N_REPS:,})') axes[1, col].set_xlabel('Sample mean') axes[1, col].set_ylabel('Density') axes[1, col].legend(fontsize=7) sw_stat, sw_p = stats.shapiro(sm[:500]) axes[1, col].text(0.97, 0.05, f'SW p={sw_p:.3f}', transform=axes[1, col].transAxes, ha='right', va='bottom', fontsize=8, bbox=dict(boxstyle='round', fc='white', alpha=0.7)) plt.tight_layout() plt.show() print('Even when the population is highly non-normal, sample means (n=50) are well-approximated') print('by a Normal distribution — this is the Central Limit Theorem in action.')"
