          - heading "Distribution Identification Checklist" [level=3] [ref=f8e2348]
          - code [ref=f8e2350]: "1. Is the variable discrete (counts) or continuous? 2. Continuous: a. Is it bounded below at 0? → Log-normal, Gamma, Exponential, Weibull b. Is it bounded in [0,1]? → Beta c. Symmetric, unbounded? → Normal (check Q-Q plot) 3. Discrete: a. Count of events per interval? → Poisson (check mean ≈ variance) b. Count of successes in n trials? → Binomial c. Count with overdispersion? → Negative Binomial"
