            - generic [ref=f8e365]: "mu, sigma = 100, 15 # IQ score scale x = np.linspace(40, 160, 500) pdf_vals = stats.norm.pdf(x, loc=mu, scale=sigma) cdf_vals = stats.norm.cdf(x, loc=mu, scale=sigma) fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(14, 4)) fig.suptitle('Normal Distribution: PDF and CDF', fontsize=13, fontweight='bold') # PDF ax1.plot(x, pdf_vals, color=COLORS['primary'], linewidth=2.5, label='PDF') ax1.fill_between(x, pdf_vals, where=(x >= 85) & (x <= 115), color=COLORS['primary'], alpha=0.25, label='P(85 <= X <= 115)') ax1.axvline(mu, color=COLORS['danger'], linestyle='--', lw=1.5, label=f'mean={mu}') ax1.set_xlabel('IQ score') ax1.set_ylabel('Density') ax1.set_title('PDF — probability density at each value') ax1.legend() # CDF ax2.plot(x, cdf_vals, color=COLORS['secondary'], linewidth=2.5, label='CDF') # Annotate specific quantiles for q, color in [(0.16, COLORS['accent']), (0.50, COLORS['danger']), (0.84, COLORS['success'])]: x_q = stats.norm.ppf(q, loc=mu, scale=sigma) ax2.annotate(f'P(X<={x_q:.0f})={q:.2f}', xy=(x_q, q), xytext=(x_q - 20, q + 0.08), arrowprops=dict(arrowstyle='->', color='black', lw=1), fontsize=9) ax2.scatter([x_q], [q], color=color, s=60, zorder=5) ax2.axhline(0.5, color=COLORS['danger'], linestyle=':', lw=1) ax2.set_xlabel('IQ score') ax2.set_ylabel('Cumulative probability') ax2.set_title('CDF — fraction of data below x') ax2.legend() plt.tight_layout() plt.show() print(f'Area under PDF from 85 to 115: {stats.norm.cdf(115, mu, sigma) - stats.norm.cdf(85, mu, sigma):.4f}') print(f'Same, using CDF directly: {stats.norm.cdf(115, mu, sigma) - stats.norm.cdf(85, mu, sigma):.4f}')"
