    - generic [ref=e27]:
      - img "李佳佳" [ref=e30]
      - generic [ref=e31]:
        - paragraph [ref=e32]: 李佳佳 · 北京师范大学社会学院讲师
        - paragraph [ref=e33]: 我目前在北京师范大学社会学院担任讲师，主要从事人口健康、社会流行病学与老龄健康研究。我的研究兴趣源于一个朴素的问题：一个人早年经历的健康不平等，是如何在几十年后仍然影响其老年生活质量的？从兰州大学社会学本科，到北京大学人口学博士与博士后，再到牛津大学老龄研究所的访问学者，我始终关注生命历程视角下的健康公平问题。我希望通过严谨的纵向数据分析与跨国比较，为理解童年不良经历的健康代价、识别可干预窗口提供证据，并推动开放、可重复的调查研究方法。
